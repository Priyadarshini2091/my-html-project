<head>

    <title>Document</title>
    <style>
        ul.u {

        }
        ul.v {
            list-style-type: circle;
        }
        ul.w {

        }
        ul.x {
            list-style-type: none;
            padding: 20px;
        }
        /* ul.y {
            list-style-image: url(Assets1/giphy.gif);

        } */
        ul.y {

        }
        ul.z {
            background-color: aquamarine;
            color: darkgoldenrod;
            list-style-image: url(Assets1/giphy.gif);
            list-style-position: outside;
        }

    </style>
</head>
<body>

</html>
