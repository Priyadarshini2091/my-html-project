<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table,th,td {
            border: 1px solid;
            text-align: center;
            vertical-align: bottom;
            padding: 15px;
        }
        th{
            height: 70px;
        }
        td:hover{
            background-color: cornflowerblue;
        }
        tr:nth-child(odd){
            background-color: bisque;
        }
        tr:nth-child(even){
            background-color: rgb(47, 231, 124);
        }
    </style>
</head>
<body>
    <div style="overflow-x: auto;">
    <h1>CSS Tables</h1>
    <table>
        <tr>
            <th>name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Priyadarshini Muduli</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Sandhya Rani</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Anuradha Majhi</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Abhisek sahu</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Virat kholi</td>
            <td>37</td>
        </tr>
    </table>
    </div>
</body>
</html>
