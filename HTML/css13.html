        li {
            display: inline; 
        }
        span {
            display: block;
        }
        h1 {
            /* display: none; */
            visibility: visible;
        }
        div.ex1 {

        }
        div.ex2 {

            position: absolute;
        }
        div.ex {
            max-width: 500px;

            border: 1px solid black;
            position: sticky;
        }

</head>
