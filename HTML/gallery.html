<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="homepage.css">
</head>
<body class="Gallery">

<!-- Navigation -->
<nav>
  <a href="homepage.html">Home</a>
  <a href="about.html">About Me</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact Me</a>
</nav>

<h1 data-aos="fade-down">Gallery</h1>

<!-- Gallery Grid -->
<div class="gallery" data-aos="fade-up">
  <img src="Assets/image 1.jpg" alt="Priya 1" title="Priya 1" onclick="openLightbox(this)">
  <img src="Assets/image2.jpg" alt="Priya 2" title="Priya 2" onclick="openLightbox(this)">
  <img src="Assets/image4.jpg" alt="Priya 3" title="Priya 3" onclick="openLightbox(this)">
  <img src="Assets/image 3.jpg" alt="Priya 4" title="Priya 4" onclick="openLightbox(this)">
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Lightbox Image" />
</div>

<!-- Video Section -->
<div class="video-section" data-aos="zoom-in">
  <h2>My Short Reel</h2>
  <video controls>
    <source src="VIDEO/WhatsApp Video 2025-04-18 at 10.13.03 AM.mp4" type="video/mp4">
    <!-- Your browser does not support the video tag. -->
  </video>
</div>

<!-- Image Map -->
<div class="map-section" data-aos="fade-up">
  <h2>Explore Map</h2>
  <img src="Assets/map.png" usemap="#worldmap" alt="World Map">
  <map name="worldmap">
    <area shape="rect" coords="34,44,270,350" alt="Region1" href="about.html">
    <area shape="circle" coords="337,300,44" alt="Region2" href="contact.html">
  </map>
</div>

<!-- AOS JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init();

  function openLightbox(img) {
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox').style.display = 'flex';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }
</script>

</body>
</html>
